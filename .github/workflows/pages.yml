name: Deploy Pages

on:
  workflow_run:
    workflows: ['Quality']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-report:
    name: Build report
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Generate HTML test report
        run: yarn test:report

      - name: Generate summary page
        run: yarn test:summary

      - name: Copy static portfolio page
        run: cp portfolio.html test-results/portfolio.html

      - name: Copy diagram pages
        run: |
          mkdir -p test-results/diagrams
          cp docs/diagrams/*.html test-results/diagrams/

      # The Helpdesk's in-browser demo (#942), served at /platform-main/helpdesk/:
      # the app with its database and API running in the visitor's browser.
      - name: Build the Helpdesk demo
        run: yarn nx build helpdesk -c demo --base-href /platform-main/helpdesk/

      # 404.html is the whole site's "not found" page: a reload on a demo page
      # (Pages serves only real files) goes back to the demo, which opens that
      # page; anything else gets a plain "not found".
      - name: Copy the Helpdesk demo
        run: |
          mkdir -p test-results/helpdesk
          cp -r dist/projects/helpdesk-demo/browser/. test-results/helpdesk/
          cp projects/helpdesk/src/demo/404.html test-results/404.html

      - name: Upload report artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-results

  deploy:
    name: Deploy to Pages
    needs: build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
