name: Restore drill

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  restore-drill:
    name: Restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_DB: helpdesk-drill
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk-drill-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk-drill"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Create and restore a test backup
        run: |
          PGPASSWORD=helpdesk-drill-password pg_dump \
            -h localhost -U helpdesk -d helpdesk-drill \
            -Fc --no-owner --no-privileges -f helpdesk-drill.dump

          PGPASSWORD=helpdesk-drill-password psql \
            -h localhost -U helpdesk -p 5432 -d postgres \
            -c 'DROP DATABASE IF EXISTS "helpdesk-drill-restore";' \
            -c 'CREATE DATABASE "helpdesk-drill-restore";'

          PGPASSWORD=helpdesk-drill-password pg_restore \
            --clean --if-exists --no-owner --no-privileges \
            -h localhost -U helpdesk -d helpdesk-drill-restore \
            helpdesk-drill.dump

          PGPASSWORD=helpdesk-drill-password psql \
            -h localhost -U helpdesk -d helpdesk-drill-restore \
            -c "SELECT 1;" >/dev/null

          echo "Restore drill completed successfully."
        env:
          PGPASSWORD: helpdesk-drill-password