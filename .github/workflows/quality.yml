name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Check module dependency ranges
        run: yarn check:versions

      - name: Run lint
        run: yarn nx affected -t lint

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Run test suite
        run: yarn nx affected -t test

      - name: Test repo scripts
        run: yarn test:scripts

      # A task that writes into the source tree (as the schematics build once
      # did into schematics-core, #478) leaves tracked or unignored changes.
      - name: Check the tests left the source tree unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Tests changed or added files in the source tree:"
            git status --porcelain
            exit 1
          fi

  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Run build
        run: yarn nx affected -t build

      # A build that writes into the source tree (as the schematics build once
      # did into schematics-core, #478) leaves tracked or unignored changes.
      - name: Check the build left the source tree unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build changed or added files in the source tree:"
            git status --porcelain
            exit 1
          fi

  prettier:
    name: Prettier (format check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Prettier format check
        run: npx prettier --check .
