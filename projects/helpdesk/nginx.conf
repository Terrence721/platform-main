# The Helpdesk app's web server in its Docker image (projects/helpdesk/
# Dockerfile): serves the built app and passes /api to the API container,
# as the dev server's proxy.conf.mjs does in development. Same origin for
# both, so the app needs no CORS and its sign-in cookie just works.
server {
  # 8080: the image runs nginx as a non-root user, which can't take port 80.
  listen 8080;
  root /usr/share/nginx/html;

  # The live updates stream (#950): server-sent events, passed on as they
  # come (no buffering) over one long-lived connection. The API pings
  # every 25 s; the hour is so a quiet stream is never cut by a timeout.
  location = /api/events {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # The API, by its service name on Compose's network.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built JS and CSS carry a content hash in their names (main-AbC12xyZ.js),
  # so a changed file is a new name: browsers may keep them for a year.
  # (Quoted: nginx would read the {8} as a block.)
  location ~* "-[A-Za-z0-9_]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else: the file if there is one, otherwise the app, whose
  # router shows /agent, /supervisor and the rest. index.html is never
  # cached, so a new build is picked up on the next visit.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
