# The Helpdesk's database for local development. `yarn start:helpdesk`
# starts it fresh on every run (migrated and seeded) and deletes it, data
# and all, when the app window closes; `yarn db:reset` deletes it by hand.
# Values come from .env (copy .env.example); the defaults below match it.
#
# The `full` profile runs the whole help desk in containers, with nothing
# but Docker installed: `docker compose --profile full up --build`, then
# open http://localhost:8088. It adds the API (projects/helpdesk-api/
# Dockerfile) and the app behind nginx (projects/helpdesk/Dockerfile).
# Without the profile, Compose starts only the database, as
# `yarn start:helpdesk` needs.
name: helpdesk

services:
  db:
    # Docker's official image, from Amazon ECR Public's mirror: Docker Hub
    # limits anonymous pulls per address, which CI's shared runners hit
    # (#1318).
    image: public.ecr.aws/docker/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${HELPDESK_DB_NAME:-helpdesk}
      POSTGRES_USER: ${HELPDESK_DB_USER:-helpdesk}
      POSTGRES_PASSWORD: ${HELPDESK_DB_PASSWORD:-helpdesk-dev-only}
    ports:
      # localhost only: the database is not reachable from other machines.
      # 5435, not PostgreSQL's usual 5432, so it can run beside other local
      # databases (5432-5434 are commonly taken by other projects).
      - '127.0.0.1:${HELPDESK_DB_PORT:-5435}:5432'
    volumes:
      # PostgreSQL 18+ keeps its data under /var/lib/postgresql (older
      # images used /var/lib/postgresql/data).
      - helpdesk-db:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: projects/helpdesk-api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The database by its name on Compose's own network.
      DATABASE_URL: postgres://${HELPDESK_DB_USER:-helpdesk}:${HELPDESK_DB_PASSWORD:-helpdesk-dev-only}@db:5432/${HELPDESK_DB_NAME:-helpdesk}
      # Seeds an empty database on first start; restarts keep the data.
      HELPDESK_SEED: 'true'
      HELPDESK_SEED_PASSWORD: ${HELPDESK_SEED_PASSWORD:-helpdesk-dev-only}
      # Unset by default: the API then signs sessions with a random secret
      # made at each start (it refuses the published development one).
      HELPDESK_JWT_SECRET: ${HELPDESK_JWT_SECRET:-}
    ports:
      # localhost only, like the database. The same port as `nx serve`, so
      # run one or the other.
      - '127.0.0.1:3000:3000'

  app:
    profiles: [full]
    build:
      context: .
      dockerfile: projects/helpdesk/Dockerfile
    # nginx looks the API up by name when it starts, so the API comes first.
    depends_on:
      api:
        condition: service_healthy
    ports:
      # localhost only. 8088, not 8080, which other local tools often hold;
      # HELPDESK_APP_PORT in .env picks another.
      - '127.0.0.1:${HELPDESK_APP_PORT:-8088}:8080'

volumes:
  helpdesk-db:
