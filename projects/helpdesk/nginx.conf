# The Helpdesk app's web server in its Docker image (projects/helpdesk/
# Dockerfile): serves the built app and passes /api to the API container,
# as the dev server's proxy.conf.mjs does in development. Same origin for
# both, so the app needs no CORS and its sign-in cookie just works.

# How long a browser may keep each file. Built JS and CSS carry a content
# hash in their names (main-AbC12xyZ.js), so a changed file is a new name:
# kept for a year. index.html is never kept, so a new build is picked up on
# the next visit. Anything else gets no Cache-Control (an empty value adds
# no header). A map rather than add_header in each location: nginx drops
# the server's add_header lines in a location that has its own (#1282).
# (Quoted: nginx would read the {8} as a block.)
map $uri $cache_control {
  "~*-[A-Za-z0-9_]{8}\.(js|css)$" "public, max-age=31536000, immutable";
  /index.html "no-cache";
  default "";
}

server {
  # 8080: the image runs nginx as a non-root user, which can't take port 80.
  listen 8080;
  root /usr/share/nginx/html;

  # On every answer, the API's too, refusals included (always): no guessing
  # a file's type, never shown in another site's frame, and only this site
  # told which page a visitor came from. No nginx version in the Server
  # header or on its error pages (#1282).
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cache-Control $cache_control;

  # Text, scripts, styles and JSON compressed (the base image leaves gzip
  # off); not the live updates stream, which is sent as it comes.
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The live updates stream (#950): server-sent events, passed on as they
  # come (no buffering) over one long-lived connection. The API pings
  # every 25 s; the hour is so a quiet stream is never cut by a timeout.
  location = /api/events {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # The API, by its service name on Compose's network.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A hashed script or style that is not there is a 404, never the app's
  # page in its place.
  location ~* "-[A-Za-z0-9_]{8}\.(js|css)$" {
    try_files $uri =404;
  }

  # Everything else: the file if there is one, otherwise the app, whose
  # router shows /agent, /supervisor and the rest.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
