# Production override for the Helpdesk stack.
#
# Use it beside compose.yaml:
#
#   docker compose -f compose.yaml -f compose.production.yaml up --build -d
#
# It keeps the database and API off the host (they are still reachable on
# Compose's private network) and leaves TLS to a reverse proxy or load
# balancer in front of the app. No database or API port should be
# published in production.
services:
  db:
    restart: unless-stopped
    ports: []

  api:
    restart: unless-stopped
    environment:
      # Production defaults to no demo seed. Set HELPDESK_SEED=true on the
      # first deployment if you want the demo users, then back to false.
      HELPDESK_SEED: ${HELPDESK_SEED:-false}

  app:
    restart: unless-stopped

  api:
    ports: []

  app:
    # Expose the app's nginx behind TLS termination owned by the proxy or
    # load balancer in front of it.
    ports:
      - '80:8080'

  clamav:
    deploy:
      resources:
        limits:
          memory: 1.5g
        reservations:
          memory: 1g
