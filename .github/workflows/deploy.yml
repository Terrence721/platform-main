name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish and deploy'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tag
        id: tag
        run: |
          tag="${{ github.event.inputs.image_tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            tag="${{ github.sha }}"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/helpdesk-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/helpdesk-api:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository }}/helpdesk-api:latest

      - name: Publish the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/helpdesk/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/helpdesk-app:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository }}/helpdesk-app:latest

      - name: Summarise the published images
        run: |
          echo "Published ghcr.io/${{ github.repository }}/helpdesk-api:${{ steps.tag.outputs.value }}"
          echo "Published ghcr.io/${{ github.repository }}/helpdesk-app:${{ steps.tag.outputs.value }}"
          echo "Roll back by redeploying the previous tag."

  deploy:
    name: Record deployment intent
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Produce the deployment summary
        run: |
          echo "Deploy the API and app images with the tag above."
          echo "Run database migrations as a controlled step:"
          echo "  yarn db:generate"
          echo "  yarn db:migrate"
          echo "Then smoke-test /api/health."
          echo "Roll back by redeploying the previous published tag."
