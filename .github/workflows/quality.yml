name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Check module dependency ranges
        run: yarn check:versions

      - name: Run lint
        run: yarn nx affected -t lint

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Run test suite
        run: yarn nx affected -t test

      - name: Test repo scripts
        run: yarn test:scripts

      # A task that writes into the source tree (as the schematics build once
      # did into schematics-core, #478) leaves tracked or unignored changes.
      - name: Check the tests left the source tree unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Tests changed or added files in the source tree:"
            git status --porcelain
            exit 1
          fi

  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Run build
        run: yarn nx affected -t build

      # The Helpdesk's migrations are generated from its schema. A schema
      # change without its migration makes this write a new one, which the
      # next step then reports (#1053). drizzle-kit generates offline: it
      # compares the schema with the last snapshot, with no database.
      - name: Generate any Helpdesk migration the schema needs
        run: yarn db:generate

      # A build that writes into the source tree (as the schematics build once
      # did into schematics-core, #478) leaves tracked or unignored changes.
      - name: Check the build left the source tree unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build changed or added files in the source tree:"
            git status --porcelain
            exit 1
          fi

  prettier:
    name: Prettier (format check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Prettier format check
        run: npx prettier --check .

  docker:
    name: Docker images (helpdesk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node and the dependencies, for the end-to-end tests (#986) once the
      # stack is up.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Builds the API and app images and starts them with the database, as
      # `docker compose --profile full up` does on a machine; --wait returns
      # once all three report healthy (the API after migrating and seeding).
      - name: Build and start the whole help desk
        run: docker compose --profile full up --build --detach --wait

      - name: Check the API answers and the seed signs in
        run: |
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent --output /dev/null \
            --header 'content-type: application/json' \
            --data '{"userId":"sam.rivera","password":"helpdesk-dev-only"}' \
            http://localhost:3000/api/auth/sign-in

      # The app's page from nginx, and the API through nginx's /api
      # forwarding, as the browser reaches it.
      - name: Check the app loads and reaches the API
        run: |
          curl --fail --silent --output /dev/null http://localhost:8088/
          curl --fail --silent http://localhost:8088/api/health

      # The specs that need two connections at once, which PGlite cannot
      # give (#1085), against the stack's PostgreSQL; each works in a
      # scratch database of its own.
      - name: Run the real-PostgreSQL specs
        run: npx vitest run --project helpdesk-server projects/helpdesk-server/src/lib/tickets/tickets.race.spec.ts
        env:
          HELPDESK_RACE_DATABASE_URL: postgres://helpdesk:helpdesk-dev-only@localhost:5435/helpdesk

      # The end-to-end tests (#986) in Chromium, against this stack as it is
      # (E2E_BASE_URL: their setup leaves it to this job). Only Chromium,
      # with the system libraries it needs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: yarn nx e2e helpdesk-e2e
        env:
          E2E_BASE_URL: http://localhost:8088

      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-e2e-report
          path: dist/.playwright/projects/helpdesk-e2e/
          retention-days: 14

      - name: Show the API's and the app's logs
        if: always()
        run: docker compose --profile full logs api app

      - name: Stop and remove everything
        if: always()
        run: docker compose --profile full down --volumes
